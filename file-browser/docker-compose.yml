version: "3.8"

services:
  filebrowser:
    image: filebrowser/filebrowser:latest
    container_name: filebrowser

    ports:
      - "8080:80"

    volumes:
      - /data/files:/srv
      - /home/madmax/stacks/file-browser/config:/config
      - /home/madmax/stacks/file-browser/database:/database

    restart: unless-stopped
